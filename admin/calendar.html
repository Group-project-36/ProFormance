<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Schedule Management</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <aside class="sidebar" id="sidebar-placeholder"></aside>

        <main class="main">
            <header class="topbar">
                <div class="search-box" style="position: relative;">
                    <input type="text" placeholder="Search schedules..." id="main-search" autocomplete="off">
                    <div id="search-results" class="search-results-dropdown"></div>
                </div>
                <div class="top-actions">
                    <div class="avatar" id="profile-avatar">A</div>
                </div>
            </header>

            <section class="content">
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <h1>Global Schedule</h1>
                    <button class="add-btn" onclick="window.openEventModal()">
                        <i class="fas fa-plus"></i> Create Event
                    </button>
                </div>

                <div class="table-container" style="margin-top: 20px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Event Name</th>
                                <th>Type</th>
                                <th>Date & Time</th>
                                <th>Staff</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="calendar-table-body">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="event-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Task Details</h2>
                <button class="modal-close" onclick="window.closeEventModal()">&times;</button>
            </div>
            <form id="event-form" class="modal-body">
                <input type="hidden" id="event-id">
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" id="event_name" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="event_type">
                        <option value="Promoting">Promoting</option>
                        <option value="Maintenance">Website Maintenance</option>
                        <option value="Delivery">Delivery</option>
                        <option value="Product Launch">New Product Launch</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Time *</label>
                    <input type="datetime-local" id="start_time" required>
                </div>
                <div class="form-group">
                    <label>Assigned Staff</label>
                    <input type="text" id="staff_name">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="event_status">
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Cancelled">Cancelled</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
            </form>
        </div>
    </div>
    
    <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="window.closeEventModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Sync to Server</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script/common.js"></script>
    <script src="script/calendar.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
