<!DOCTYPE html>
<html lang="en">
  <!--header-->
<head>
  <meta charset="utf-8">
  <title>Customer (ProFormance)</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

  
<body>
  <div id="app">
    <!--Side Bar-->
    <aside class="sidebar"> 
        <div class="logo">
          <img src="assets/Proformance logo.png" alt="ProFormance Logo" class="logo-img">
        </div>
      
        <nav class="nav">
          <div class="nav-section">
              <h3>Main Menu</h3>
              <a href="index.html"id="nav-overview"><i class="fas fa-border-all"></i> Overview</a>
              <a href="#"><i class="fas fa-chart-column"></i> Analytics</a>
              <a href="#"><i class="fas fa-dumbbell"></i> Products</a>
              <a href="customer.html" class="active"><i class="fas fa-users"></i> Customers</a>
          </div>
        </nav>
    </aside>
  
    <main class="main" id="main-placeholder">
        <!--header-->
        <header class="topbar">
            <div class="search-box">
                <input type="text" placeholder="Search Here" name="search" id="main-search"/>
            </div>
          
            <div class="top-actions">
                <span class="notification"></span> 
                <div class="avatar">A</div>
            </div>
        </header>
        
        <section class="content">
          
          <div class="card">
            <h1>Customer Management</h1>
          </div>
    
          <div id="customers-view">
            <div class="controls-bar">
                <div class="search-filters">
                    <div class="search-input">
                        <input type="text" placeholder="Search customers...">
                    </div>
                    <button class="search-btn">Search</button>
                </div>
                <div class="action-buttons">
                    <button class="add-btn" id="add-customer-btn">
                        <i class="fas fa-plus"></i> Add Customer
                    </button>
                </div>
            </div>
            <div class="table-container">
                <div class="table-header">
                    <h2>Registered Customers</h2>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Join Date</th>
                            <th>Orders</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                  
                    <tbody id="customer-table-body">
                    </tbody>
                </table>
            </div>
        </div>

    </section>      
  </main>

    <!-- Add customer-->
    <div id="add-customer-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add New Customer</h2>
        <button class="modal-close">&times;</button>
      </div>
      
      <form id="customer-form" class="modal-body">
        
        <div class="form-group">
          <label>Name *</label>
          <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" required>
        </div>
        
        <div class="form-group">
          <label>Join Date</label>
          <input type="date" id="join-date">
        </div>
        
        <div class="form-group">
          <label>Orders</label>
          <input type="number" id="orders" min="0" value="0">
        </div>
        
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeAddCustomerModal()">Cancel</button>
          <button type="submit" class="btn-submit">Add Customer</button>
        </div>
        
      </form>
    </div>
  </div>
  
</div>
  <script src="script/customer.js"></script>
</body>
</html>
