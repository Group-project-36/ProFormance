<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sales Management - ProFormance</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <aside class="sidebar" id="sidebar-placeholder"></aside>

        <main class="main">
            <header class="topbar">
                <div class="search-box" style="position: relative;">
                    <input type="text" placeholder="Search by Order ID or Customer..." id="main-search" autocomplete="off">
                    <div id="search-results" class="search-results-dropdown"></div>
                </div>
                <div class="top-actions">
                    <div class="profile-container">
                        <button class="avatar" id="profile-avatar">A</button>
                        <div class="profile-dropdown" id="profile-dropdown">
                            <div class="profile-header">Admin Name</div>
                            <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content">
                <div class="card" style="margin-bottom: 20px;">
                    <h1>Sales & Orders</h1>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Today's Revenue</h3>
                        <div class="stat-number" id="today-revenue">£0.00</div>
                    </div>
                    <div class="stat-card">
                        <h3>Pending Orders</h3>
                        <div class="stat-number" id="pending-count">0</div>
                    </div>
                </div>

                <div class="table-container" style="margin-top: 20px;">
                    <div class="table-header" style="display:flex; justify-content:space-between; align-items:center;">
                        <h2>All Transactions</h2>
                        <select id="status-filter" class="action-btn" style="background:white;">
                            <option value="all">All Status</option>
                            <option value="completed">Completed</option>
                            <option value="pending">Pending</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Date</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="sales-table-body">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="order-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Order Details</h2>
                <button class="modal-close" onclick="closeOrderModal()">&times;</button>
            </div>
            <div class="modal-body" id="order-details-content">
                </div>
        </div>
    </div>

    <script src="script/common.js"></script>
    <script src="script/sales.js"></script>
</body>
</html>
